[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ninisite-crawler"
version = "1.0.0"
description = "Crawler for the NiniSite (ninisite.com) discussion forums"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25",
    "beautifulsoup4>=4.9",
    "pandas>=1.3",
    "numpy",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/Akhorramrouz/ninisite_crawler"

[tool.setuptools]
packages = ["ninisite_crawler"]
